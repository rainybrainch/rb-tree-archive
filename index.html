<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>RB-Tree Archive — RAINY BRAIN</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg:      #060c08;
  --bg2:     #0c1810;
  --panel:   rgba(10,20,12,.94);
  --line:    rgba(100,180,120,.13);
  --text:    #d4e8d0;
  --muted:   rgba(180,210,180,.52);
  --faint:   rgba(180,210,180,.28);
  --econ:    #c9a84c;  --econ-rgb:  201,168,76;
  --poli:    #6bb6ff;  --poli-rgb:  107,182,255;
  --invest:  #57c87c;  --invest-rgb:87,200,124;
  --font:    "Noto Sans JP", sans-serif;
  --serif:   "Noto Serif JP", serif;
  color-scheme: dark;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:var(--font);color:var(--text);background:var(--bg);overflow:hidden;}
button,input,textarea,select{font:inherit;color:inherit;}

/* ── LAYOUT ── */
.app{display:flex;flex-direction:column;height:100vh;}

/* ── HEADER ── */
.header{
  flex-shrink:0;
  display:flex;align-items:center;gap:12px;padding:0 18px;height:50px;
  border-bottom:1px solid var(--line);
  background:rgba(6,12,8,.96);backdrop-filter:blur(12px);
  z-index:20;
}
.logo{display:flex;align-items:center;gap:9px;white-space:nowrap;flex-shrink:0;}
.logo-mark{font-size:20px;}
.logo-name{font-family:var(--serif);font-size:14px;font-weight:700;letter-spacing:.06em;}
.logo-rb{font-size:9px;color:var(--muted);letter-spacing:.16em;margin-top:1px;}
.h-search{
  flex:1;max-width:400px;
  display:flex;align-items:center;gap:7px;
  padding:5px 11px;border:1px solid var(--line);border-radius:999px;
  background:rgba(0,0,0,.32);transition:border-color .2s;
}
.h-search:focus-within{border-color:rgba(100,180,120,.4);}
.h-search input{flex:1;background:0;border:0;outline:0;font-size:12px;}
.h-search input::placeholder{color:var(--faint);}
.h-right{margin-left:auto;display:flex;gap:7px;align-items:center;}
.view-toggle{
  display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;
}
.vt-btn{
  padding:5px 11px;border:0;background:0;cursor:pointer;
  font-size:11px;font-weight:900;color:var(--muted);transition:all .15s;
}
.vt-btn.active{background:rgba(100,180,120,.18);color:var(--text);}

/* ── TABS ── */
.tabs{
  flex-shrink:0;
  display:flex;align-items:center;gap:0;
  border-bottom:1px solid var(--line);
  background:rgba(6,12,8,.94);
  padding:0 18px;
  overflow-x:auto;scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none;}
.tab{
  display:flex;align-items:center;gap:7px;
  padding:10px 16px;border:0;background:0;cursor:pointer;
  font-size:12px;font-weight:900;letter-spacing:.04em;color:var(--muted);
  border-bottom:2px solid transparent;margin-bottom:-1px;
  white-space:nowrap;transition:all .15s;
}
.tab:hover{color:var(--text);}
.tab.active{color:var(--text);border-bottom-color:var(--tab-c,var(--invest));}
.tab-dot{width:7px;height:7px;border-radius:999px;background:var(--tab-c,var(--invest));}

/* ── CONTENT ── */
.content{flex:1;overflow:hidden;position:relative;}
.view{position:absolute;inset:0;overflow:auto;display:none;}
.view.active{display:block;}

/* ── TREE VIEW ── */
#treeView{overflow:hidden;cursor:default;}
.tree-canvas{
  position:relative;
  width:100%;height:100%;
  overflow:auto;
  scrollbar-width:thin;scrollbar-color:rgba(100,180,120,.18) transparent;
}
.tree-canvas::-webkit-scrollbar{width:5px;height:5px;}
.tree-canvas::-webkit-scrollbar-thumb{background:rgba(100,180,120,.2);border-radius:999px;}
.tree-svg-wrap{
  position:relative;
  min-width:100%;
  padding:0;
}
.tree-bg{
  position:sticky;left:0;top:0;width:100vw;height:100vh;pointer-events:none;
  background:
    radial-gradient(ellipse at 50% 80%, rgba(var(--cat-rgb,87,200,124),.07), transparent 55%),
    radial-gradient(ellipse at 20% 20%, rgba(var(--cat-rgb,87,200,124),.04), transparent 40%);
  z-index:0;
}

/* ── SVG STYLES ── */
.tree-stage-row{fill:rgba(255,255,255,.022);}
.tree-stage-label{
  fill:rgba(180,210,180,.25);
  font-family:"Noto Sans JP",sans-serif;
  font-size:11px;font-weight:700;letter-spacing:.12em;
}
.tree-edge{
  fill:none;
  stroke:rgba(var(--cat-rgb,87,200,124),.22);
  stroke-width:1.5;
  stroke-dasharray:4 0;
}
.tree-edge.highlighted{stroke:rgba(var(--cat-rgb,87,200,124),.65);stroke-width:2;}
.tree-node{cursor:pointer;}
.tree-node .node-bg{
  fill:rgba(10,20,12,.86);
  stroke:rgba(var(--cat-rgb,87,200,124),.32);
  stroke-width:1.5;
  transition:stroke .15s,filter .15s;
}
.tree-node:hover .node-bg{
  stroke:rgba(var(--cat-rgb,87,200,124),.85);
  filter:drop-shadow(0 0 10px rgba(var(--cat-rgb,87,200,124),.35));
}
.tree-node.selected .node-bg{
  stroke:rgba(var(--cat-rgb,87,200,124),1);
  filter:drop-shadow(0 0 18px rgba(var(--cat-rgb,87,200,124),.5));
}
.node-icon{fill:var(--text);font-size:12px;dominant-baseline:central;}
.node-text{
  fill:var(--text);
  font-family:"Noto Sans JP",sans-serif;
  font-size:12px;font-weight:700;
  dominant-baseline:central;
}
.tree-root-circle{
  fill:rgba(var(--cat-rgb,87,200,124),.14);
  stroke:rgba(var(--cat-rgb,87,200,124),.55);
  stroke-width:2;
  filter:drop-shadow(0 0 16px rgba(var(--cat-rgb,87,200,124),.3));
}
.tree-root-text{
  fill:var(--text);
  font-family:"Noto Serif JP",serif;
  font-size:14px;font-weight:700;letter-spacing:.06em;
  dominant-baseline:central;text-anchor:middle;
}
.orphan-line{
  stroke:rgba(var(--cat-rgb,87,200,124),.1);
  stroke-width:1;stroke-dasharray:3 4;fill:none;
}

/* ── STAGE LEGEND ── */
.stage-legend{
  position:absolute;bottom:16px;right:16px;z-index:10;
  display:flex;gap:6px;
  padding:8px 12px;border-radius:10px;
  background:rgba(6,12,8,.88);backdrop-filter:blur(12px);
  border:1px solid var(--line);
  pointer-events:none;
}
.legend-item{display:flex;align-items:center;gap:5px;font-size:10px;font-weight:900;color:var(--muted);}

/* ── CARDS VIEW ── */
#cardView{padding:16px 20px;background:var(--bg);}
.cards-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.result-count{font-size:12px;color:var(--muted);font-weight:700;}
.add-btn{
  margin-left:auto;display:flex;align-items:center;gap:6px;
  padding:7px 13px;border-radius:8px;border:1px solid rgba(100,180,120,.4);
  background:rgba(100,180,120,.12);cursor:pointer;
  font-size:12px;font-weight:900;transition:background .15s;
}
.add-btn:hover{background:rgba(100,180,120,.22);}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}
.card{
  border:1px solid var(--line);border-radius:10px;background:rgba(10,20,12,.88);
  padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:8px;
  transition:border-color .18s,transform .12s,box-shadow .18s;
}
.card:hover{border-color:rgba(var(--ccat-rgb,87,200,124),.5);transform:translateY(-1px);box-shadow:0 6px 20px rgba(0,0,0,.3);}
.card-top{display:flex;align-items:center;gap:7px;}
.card-stage-ico{font-size:18px;line-height:1;}
.card-cat{font-size:9px;font-weight:900;letter-spacing:.1em;padding:2px 7px;border-radius:999px;}
.card-kw{font-family:var(--serif);font-size:16px;font-weight:700;line-height:1.2;overflow-wrap:anywhere;}
.card-body{font-size:11px;color:var(--muted);line-height:1.55;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.card-footer{display:flex;align-items:center;gap:7px;margin-top:auto;}
.card-br{font-size:10px;color:var(--faint);font-weight:700;}
.card-date{font-size:10px;color:var(--faint);margin-left:auto;}
.empty-state{grid-column:1/-1;text-align:center;padding:60px 0;color:var(--faint);font-size:14px;}

/* ── MODAL ── */
.overlay{
  position:fixed;inset:0;z-index:50;
  background:rgba(0,0,0,.68);backdrop-filter:blur(8px);
  display:none;align-items:flex-start;justify-content:flex-end;
}
.overlay.open{display:flex;}
.modal{
  width:min(540px,100vw);height:100vh;overflow-y:auto;
  background:linear-gradient(180deg,#0c1810,#060c08);
  border-left:1px solid var(--line);
  padding:22px;display:flex;flex-direction:column;gap:16px;
  scrollbar-width:thin;scrollbar-color:rgba(100,180,120,.15) transparent;
  animation:slideIn .22s ease;
}
@keyframes slideIn{from{transform:translateX(40px);opacity:0;}to{transform:none;opacity:1;}}
.m-close{
  align-self:flex-end;width:30px;height:30px;border-radius:7px;
  border:1px solid var(--line);background:rgba(255,255,255,.05);
  color:var(--muted);cursor:pointer;display:grid;place-items:center;font-size:15px;
  transition:background .15s;
}
.m-close:hover{background:rgba(255,255,255,.1);}
.m-stage-path{display:flex;align-items:center;gap:4px;flex-wrap:wrap;}
.m-path-item{
  font-size:10px;font-weight:900;letter-spacing:.06em;
  padding:3px 8px;border-radius:999px;
  border:1px solid var(--line);color:var(--faint);
}
.m-path-item.active{color:var(--text);border-color:rgba(100,180,120,.5);background:rgba(100,180,120,.12);}
.m-path-arrow{color:var(--faint);font-size:10px;}
.m-keyword{font-family:var(--serif);font-size:24px;font-weight:700;line-height:1.25;overflow-wrap:anywhere;}
.m-badge{
  display:inline-flex;align-items:center;gap:6px;
  font-size:10px;font-weight:900;letter-spacing:.08em;
  padding:3px 10px;border-radius:999px;
}
.m-slabel{font-size:10px;font-weight:900;letter-spacing:.14em;color:var(--faint);text-transform:uppercase;margin-bottom:7px;}
.m-body{font-size:13px;line-height:1.8;color:var(--text);overflow-wrap:break-word;white-space:pre-wrap;}
.m-branches{display:flex;flex-wrap:wrap;gap:6px;}
.m-branch{
  padding:4px 11px;border-radius:999px;border:1px solid rgba(100,180,120,.28);
  background:rgba(100,180,120,.07);font-size:11px;font-weight:700;cursor:pointer;
  transition:all .15s;
}
.m-branch:hover{border-color:rgba(100,180,120,.6);background:rgba(100,180,120,.18);}
.m-sources{display:flex;flex-direction:column;gap:5px;}
.m-source{
  display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);
  padding:6px 10px;border-radius:7px;border:1px solid var(--line);background:rgba(0,0,0,.18);
}
.m-source a{color:var(--invest);text-underline-offset:3px;}
.m-session{
  display:flex;align-items:center;gap:9px;
  padding:9px 13px;border-radius:8px;
  border:1px solid rgba(100,180,120,.2);background:rgba(100,180,120,.07);
  font-size:11px;font-weight:700;
}
.m-session a{color:var(--invest);}
.m-actions{display:flex;gap:7px;padding-top:4px;border-top:1px solid var(--line);margin-top:auto;}

/* ── FORM ── */
.form-ov{
  position:fixed;inset:0;z-index:60;
  background:rgba(0,0,0,.78);backdrop-filter:blur(10px);
  display:none;align-items:center;justify-content:center;padding:16px;
}
.form-ov.open{display:flex;}
.form-panel{
  width:min(580px,100%);max-height:90vh;overflow-y:auto;
  background:#0c1810;border:1px solid var(--line);border-radius:14px;
  padding:22px;display:flex;flex-direction:column;gap:13px;
  scrollbar-width:thin;animation:fadeUp .22s ease;
}
@keyframes fadeUp{from{transform:translateY(14px);opacity:0;}to{transform:none;opacity:1;}}
.f-title{font-family:var(--serif);font-size:17px;font-weight:700;}
.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:10px;font-weight:900;letter-spacing:.12em;color:var(--faint);text-transform:uppercase;}
.field input,.field textarea,.field select{
  padding:8px 10px;border:1px solid var(--line);border-radius:8px;
  background:rgba(0,0,0,.3);outline:0;font-size:12px;transition:border-color .15s;
}
.field input:focus,.field textarea:focus,.field select:focus{border-color:rgba(100,180,120,.5);}
.field textarea{min-height:90px;resize:vertical;line-height:1.6;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.f-actions{display:flex;gap:7px;justify-content:flex-end;padding-top:4px;border-top:1px solid var(--line);}

/* ── SYNC ── */
.sync-ov{
  position:fixed;inset:0;z-index:70;
  background:rgba(0,0,0,.78);backdrop-filter:blur(10px);
  display:none;align-items:center;justify-content:center;padding:16px;
}
.sync-ov.open{display:flex;}
.sync-panel{
  width:min(440px,100%);background:#0c1810;border:1px solid var(--line);
  border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:13px;
}
.sync-st{font-size:11px;color:var(--muted);min-height:18px;}

/* ── BUTTONS ── */
.btn{
  padding:7px 14px;border-radius:8px;border:1px solid var(--line);
  background:rgba(255,255,255,.06);cursor:pointer;font-size:11px;font-weight:900;
  letter-spacing:.04em;transition:background .15s;
}
.btn:hover{background:rgba(255,255,255,.12);}
.btn.primary{border-color:rgba(100,180,120,.48);background:rgba(100,180,120,.14);}
.btn.primary:hover{background:rgba(100,180,120,.24);}
.btn.danger{border-color:rgba(255,80,80,.4);background:rgba(255,80,80,.1);color:#ff8888;}
.btn.danger:hover{background:rgba(255,80,80,.2);}
.btn.sm{padding:5px 10px;font-size:10px;}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  padding:8px 18px;border-radius:999px;
  background:rgba(10,20,12,.95);border:1px solid rgba(100,180,120,.38);
  font-size:11px;font-weight:900;pointer-events:none;z-index:100;
  opacity:0;transition:opacity .25s;white-space:nowrap;
}
.toast.show{opacity:1;}

/* ── RESPONSIVE ── */
@media(max-width:600px){
  .modal{width:100vw;}
  .grid2{grid-template-columns:1fr;}
  .logo-rb{display:none;}
}
</style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <header class="header">
    <div class="logo">
      <span class="logo-mark">🌲</span>
      <div>
        <div class="logo-name">RB-Tree Archive</div>
        <div class="logo-rb">RAINY BRAIN</div>
      </div>
    </div>
    <div class="h-search">
      <span style="color:var(--faint);font-size:12px">🔍</span>
      <input id="searchInput" type="search" placeholder="キーワード検索…" autocomplete="off">
    </div>
    <div class="h-right">
      <div class="view-toggle">
        <button class="vt-btn active" id="btnTree" title="ツリー表示">🌲 ツリー</button>
        <button class="vt-btn" id="btnCards" title="カード表示">⊞ カード</button>
      </div>
      <button class="btn sm" id="addBtnH">＋ 追加</button>
      <button class="btn sm" id="syncOpenBtn">⇅ Gist</button>
    </div>
  </header>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" data-cat="" style="--tab-c:var(--invest)">
      <span class="tab-dot" style="background:rgba(180,210,180,.4)"></span>すべて
    </button>
    <button class="tab" data-cat="economics" style="--tab-c:var(--econ)">
      <span class="tab-dot" style="background:var(--econ)"></span>Economics
    </button>
    <button class="tab" data-cat="politics" style="--tab-c:var(--poli)">
      <span class="tab-dot" style="background:var(--poli)"></span>Politics
    </button>
    <button class="tab" data-cat="investment" style="--tab-c:var(--invest)">
      <span class="tab-dot" style="background:var(--invest)"></span>Investment
    </button>
  </div>

  <!-- Content -->
  <div class="content">

    <!-- Tree view -->
    <div class="view active" id="treeView">
      <div class="tree-canvas" id="treeCanvas"></div>
      <div class="stage-legend">
        <div class="legend-item">🌱 Seed</div>
        <div class="legend-item">🌿 Branch</div>
        <div class="legend-item">🍃 Leaf</div>
        <div class="legend-item">🌳 Tree</div>
        <div class="legend-item">🌲 Forest</div>
      </div>
    </div>

    <!-- Cards view -->
    <div class="view" id="cardView">
      <div class="cards-header">
        <span class="result-count" id="resultCount"></span>
        <button class="add-btn" id="addBtnC">＋ 新規エントリ</button>
      </div>
      <div class="cards-grid" id="cardsGrid"></div>
    </div>

  </div>
</div>

<!-- Detail modal -->
<div class="overlay" id="detailOv">
  <div class="modal">
    <button class="m-close" id="detailClose">✕</button>
    <div class="m-stage-path" id="stagePath"></div>
    <div class="m-badge" id="mBadge"></div>
    <div class="m-keyword" id="mKeyword"></div>
    <div>
      <div class="m-slabel">🍃 学びの記録</div>
      <div class="m-body" id="mBody"></div>
    </div>
    <div id="mBranchWrap">
      <div class="m-slabel">🌿 関連キーワード</div>
      <div class="m-branches" id="mBranches"></div>
    </div>
    <div id="mSourceWrap">
      <div class="m-slabel">☀ 知識源</div>
      <div class="m-sources" id="mSources"></div>
    </div>
    <div id="mSessionWrap" style="display:none">
      <div class="m-slabel">🎥 Session</div>
      <div class="m-session" id="mSession"></div>
    </div>
    <div class="m-actions">
      <button class="btn primary sm" id="mEditBtn">編集</button>
      <button class="btn danger sm" id="mDeleteBtn">削除</button>
      <button class="btn sm" id="mCloseBtn" style="margin-left:auto">閉じる</button>
    </div>
  </div>
</div>

<!-- Form -->
<div class="form-ov" id="formOv">
  <div class="form-panel">
    <div class="f-title" id="fTitle">新規エントリ</div>
    <div class="grid2">
      <div class="field">
        <label>カテゴリ</label>
        <select id="fCat">
          <option value="economics">🟡 Economics</option>
          <option value="politics">🔵 Politics</option>
          <option value="investment">🟢 Investment</option>
        </select>
      </div>
      <div class="field">
        <label>ステージ</label>
        <select id="fStage">
          <option value="seed">🌱 Seed</option>
          <option value="branch">🌿 Branch</option>
          <option value="leaf">🍃 Leaf</option>
          <option value="tree">🌳 Tree</option>
          <option value="forest">🌲 Forest</option>
        </select>
      </div>
    </div>
    <div class="field"><label>キーワード</label><input id="fKw" placeholder="例: 金利" maxlength="40"></div>
    <div class="field"><label>学びの記録（自分の言葉で）</label><textarea id="fBody" rows="5" placeholder="このキーワードについて、自分の言葉で説明してください…"></textarea></div>
    <div class="field"><label>Branch — 関連キーワード（カンマ区切り）</label><input id="fBranches" placeholder="例: 利上げ, 国債, 為替"></div>
    <div class="field"><label>Sun — 知識源（1行1件: タイトル|URL）</label><textarea id="fSources" rows="3" placeholder="日本銀行|https://www.boj.or.jp"></textarea></div>
    <div class="grid2">
      <div class="field"><label>Session</label><input id="fSession" placeholder="RB-Tree Economics #001"></div>
      <div class="field"><label>Session URL</label><input id="fSessionUrl" placeholder="https://youtube.com/..."></div>
    </div>
    <div class="f-actions">
      <button class="btn sm" id="fCancelBtn">キャンセル</button>
      <button class="btn primary sm" id="fSaveBtn">保存</button>
    </div>
  </div>
</div>

<!-- Gist sync -->
<div class="sync-ov" id="syncOv">
  <div class="sync-panel">
    <div class="f-title">⇅ Gist 同期</div>
    <div class="field"><label>Gist ID（新規作成時は空欄）</label><input id="sGistId" placeholder=""></div>
    <div class="field"><label>GitHub PAT（gist スコープ）</label><input id="sPat" type="password" placeholder="ghp_..."></div>
    <div class="sync-st" id="syncSt">未接続</div>
    <div class="f-actions">
      <button class="btn sm" id="sCancelBtn">閉じる</button>
      <button class="btn sm" id="sLoadBtn">Gistから読込</button>
      <button class="btn primary sm" id="sSaveBtn">Gistへ保存</button>
    </div>
  </div>
</div>

// ── Init ──
function init() {
  const saved = loadLocal();
  entries = saved.length ? saved : SEED_DATA.map(e=>({...e}));
  bindUI();
  setView("tree");
  renderTabs();
}

// ── View switching ──
function setView(v) {
  currentView = v;
  document.getElementById("treeView").classList.toggle("active", v==="tree");
  document.getElementById("cardView").classList.toggle("active", v==="cards");
  document.getElementById("btnTree").classList.toggle("active",  v==="tree");
  document.getElementById("btnCards").classList.toggle("active", v==="cards");
  if (v==="tree")  renderTree();
  if (v==="cards") renderCards();
}

// ── Filter ──
function filtered() {
  const q = filter.q.trim().toLowerCase();
  return entries.filter(e=>{
    if (filter.cat && e.category!==filter.cat) return false;
    if (q && !( e.keyword.toLowerCase().includes(q)||
                e.body.toLowerCase().includes(q)||
                (e.branches||[]).some(b=>b.toLowerCase().includes(q)) )) return false;
    return true;
  });
}

// ══════════════════════════════════
//  TREE VIEW
// ══════════════════════════════════
const NW=148, NH=38, HGAP=18, VGAP=130, TOP=70, SIDE=60, ROOT_R=30;

function buildConnections(list) {
  const byKw = {};
  list.forEach(e=>{ byKw[e.keyword]=e; });
  const links=[];
  list.forEach(child=>{
    (child.branches||[]).filter(Boolean).forEach(bkw=>{
      const parent=byKw[bkw];
      if(parent && STAGES.indexOf(parent.stage)<STAGES.indexOf(child.stage)){
        links.push({from:parent.id,to:child.id});
      }
    });
  });
  return links;
}

function computePositions(list) {
  const byStage={};
  STAGES.forEach(s=>{ byStage[s]=list.filter(e=>e.stage===s); });
  const pos={};
  STAGES.forEach((stage,si)=>{
    const group=byStage[stage];
    const totalW=group.length*(NW+HGAP)-HGAP;
    const startX=Math.max(SIDE, 0); // will center later
    group.forEach((e,i)=>{
      pos[e.id]={
        x:i*(NW+HGAP),
        y:TOP+si*(NH+VGAP),
        si
      };
    });
  });
  // Normalize x positions per stage to fill canvas
  return pos;
}

function renderTree() {
  const canvas = document.getElementById("treeCanvas");
  // Determine which categories to show
  const cats = filter.cat ? [filter.cat] : ["economics","politics","investment"];
  const allFiltered = filtered();
  // Render each category as a section
  let html = "";
  let totalW = 0;
  const catLayouts = [];

  cats.forEach(cat=>{
    const list = allFiltered.filter(e=>e.category===cat);
    if(!list.length) return;
    const cm = CAT_META[cat];
    const byStage={};
    STAGES.forEach(s=>{ byStage[s]=list.filter(e=>e.stage===s); });
    const maxPerRow = Math.max(1,...STAGES.map(s=>byStage[s].length));
    const w = Math.max(400, maxPerRow*(NW+HGAP)-HGAP+SIDE*2);
    const h = TOP+STAGES.length*(NH+VGAP)+60;
    catLayouts.push({cat,list,cm,byStage,w,h});
  });

  const totalHeight = catLayouts.length ? Math.max(...catLayouts.map(c=>c.h)) : 500;
  const totalWidth  = catLayouts.reduce((a,c)=>a+c.w+40,0)||800;

  canvas.style.minHeight = totalHeight + "px";

  let svgContent = "";
  let offsetX = 20;

  catLayouts.forEach(({cat,list,cm,byStage,w,h})=>{
    const rgb = cm.rgb;
    const col = CAT_COLORS[cat];

    // Category root
    const rootX = offsetX + w/2;
    const rootY = 30;

    // Compute node positions
    const pos = {};
    STAGES.forEach((stage,si)=>{
      const group = byStage[stage];
      const rowW = group.length*(NW+HGAP)-HGAP;
      const startX = offsetX + w/2 - rowW/2;
      group.forEach((e,i)=>{
        pos[e.id]={
          x: startX+i*(NW+HGAP)+NW/2,
          y: TOP+ROOT_R*2+20+si*(NH+VGAP)+NH/2
        };
      });
    });

    // Background gradient rect
    svgContent += `<defs>
      <radialGradient id="bg_${cat}" cx="50%" cy="90%" r="60%">
        <stop offset="0%" stop-color="${col}" stop-opacity="0.07"/>
        <stop offset="100%" stop-color="${col}" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect x="${offsetX}" y="0" width="${w}" height="${h}" rx="16" fill="url(#bg_${cat})" stroke="rgba(${rgb},.1)" stroke-width="1"/>`;

    // Stage row labels (left side)
    STAGES.forEach((stage,si)=>{
      const y = TOP+ROOT_R*2+20+si*(NH+VGAP);
      svgContent += `<text x="${offsetX+8}" y="${y+NH/2+4}" class="tree-stage-label">${STAGE_META[stage].icon}</text>`;
      if(byStage[stage].length>0){
        svgContent += `<rect x="${offsetX}" y="${y-4}" width="${w}" height="${NH+8}" rx="4" class="tree-stage-row"/>`;
      }
    });

    // Root node
    svgContent += `
    <circle cx="${rootX}" cy="${rootY}" r="${ROOT_R}" class="tree-root-circle" style="--cat-rgb:${rgb}"/>
    <text x="${rootX}" y="${rootY-4}" class="tree-root-text" style="font-size:11px">${cm.icon}</text>
    <text x="${rootX}" y="${rootY+9}" class="tree-root-text" style="font-size:10px">${cm.label}</text>`;

    // Lines from root to first-stage nodes
    const seedGroup = byStage["seed"];
    seedGroup.forEach(e=>{
      const p = pos[e.id];
      if(!p) return;
      const x2=p.x, y2=p.y-NH/2;
      const y1=rootY+ROOT_R;
      const mid=(y1+y2)/2;
      svgContent += `<path d="M ${rootX} ${y1} C ${rootX} ${mid} ${x2} ${mid} ${x2} ${y2}" class="tree-edge" style="--cat-rgb:${rgb}"/>`;
    });

    // Inter-node connections
    const links = buildConnections(list);
    links.forEach(({from,to})=>{
      const p1=pos[from], p2=pos[to];
      if(!p1||!p2) return;
      const x1=p1.x, y1=p1.y+NH/2;
      const x2=p2.x, y2=p2.y-NH/2;
      const mid=(y1+y2)/2;
      svgContent += `<path d="M ${x1} ${y1} C ${x1} ${mid} ${x2} ${mid} ${x2} ${y2}" class="tree-edge" style="--cat-rgb:${rgb}"/>`;
    });

    // Nodes
    list.forEach(e=>{
      const p=pos[e.id];
      if(!p) return;
      const x=p.x-NW/2, y=p.y-NH/2;
      const sm=STAGE_META[e.stage];
      const truncKw = e.keyword.length>9 ? e.keyword.slice(0,8)+"…" : e.keyword;
      svgContent += `
      <g class="tree-node" data-id="${e.id}" style="--cat-rgb:${rgb}" transform="translate(0,0)">
        <rect x="${x}" y="${y}" width="${NW}" height="${NH}" rx="19" class="node-bg"/>
        <text x="${x+22}" y="${p.y+1}" class="node-icon" style="font-size:13px">${sm.icon}</text>
        <text x="${x+36}" y="${p.y+1}" class="node-text" style="font-size:12px">${esc(truncKw)}</text>
      </g>`;
    });

    offsetX += w + 40;
  });

  const svgEl = `<svg xmlns="http://www.w3.org/2000/svg"
    width="${totalWidth}" height="${totalHeight}"
    viewBox="0 0 ${totalWidth} ${totalHeight}"
    style="display:block;min-width:${totalWidth}px">
    ${svgContent}
  </svg>`;

  canvas.innerHTML = svgEl;

  // Set background CSS var for gradient
  const catRgb = filter.cat ? CAT_META[filter.cat]?.rgb : "87,200,124";
  canvas.style.setProperty("--cat-rgb", catRgb||"87,200,124");

  // Node click events
  canvas.querySelectorAll(".tree-node").forEach(node=>{
    node.addEventListener("click", ()=>openDetail(node.dataset.id));
    node.addEventListener("mouseenter", ()=>highlightConnected(node.dataset.id, canvas));
    node.addEventListener("mouseleave", ()=>clearHighlight(canvas));
  });
}

function highlightConnected(id, canvas) {
  canvas.querySelectorAll(".tree-node").forEach(n=>{
    n.style.opacity = n.dataset.id===id ? "1" : "0.45";
  });
}
function clearHighlight(canvas) {
  canvas.querySelectorAll(".tree-node").forEach(n=>{ n.style.opacity="1"; });
}

// ══════════════════════════════════
//  CARDS VIEW
// ══════════════════════════════════
function renderCards() {
  const list = filtered();
  const grid = document.getElementById("cardsGrid");
  document.getElementById("resultCount").textContent = list.length + " 件";
  if (!list.length) {
    grid.innerHTML = `<div class="empty-state">エントリが見つかりません</div>`; return;
  }
  grid.innerHTML = list.map(e=>{
    const cm=CAT_META[e.category]||CAT_META.economics;
    const sm=STAGE_META[e.stage]||STAGE_META.seed;
    const br=(e.branches||[]).filter(Boolean).length;
    return `<div class="card" data-id="${e.id}" style="--ccat-rgb:${cm.rgb}">
      <div class="card-top">
        <span class="card-stage-ico">${sm.icon}</span>
        <span class="card-cat" style="background:rgba(${cm.rgb},.18);color:${cm.color};border:1px solid rgba(${cm.rgb},.3)">${cm.label}</span>
      </div>
      <div class="card-kw">${esc(e.keyword)}</div>
      <div class="card-body">${esc(e.body||"（本文未入力）")}</div>
      <div class="card-footer">
        <span class="card-br">${br>0?`🌿 ${br}枝`:""}</span>
        <span class="card-date">${(e.updatedAt||e.createdAt||"").slice(0,10)}</span>
      </div>
    </div>`;
  }).join("");
  grid.querySelectorAll(".card").forEach(el=>{
    el.addEventListener("click",()=>openDetail(el.dataset.id));
  });
}

// ── Tabs ──
function renderTabs() {
  document.querySelectorAll(".tab").forEach(tab=>{
    tab.classList.toggle("active", tab.dataset.cat===filter.cat);
  });
}

// ── Detail modal ──
function openDetail(id) {
  const e=entries.find(x=>x.id===id);
  if(!e) return;
  selectedId=id;
  const cm=CAT_META[e.category]||CAT_META.economics;
  const sm=STAGE_META[e.stage]||STAGE_META.seed;

  document.getElementById("stagePath").innerHTML = STAGES.map((s,i)=>{
    const m=STAGE_META[s];
    const active=s===e.stage;
    return (i>0?`<span class="m-path-arrow">→</span>`:"")+
      `<span class="m-path-item ${active?"active":""}">${m.icon} ${m.label}</span>`;
  }).join("");

  const badge=document.getElementById("mBadge");
  badge.textContent=`${cm.icon} ${cm.label}  ${sm.icon} ${sm.label}`;
  badge.style.cssText=`background:rgba(${cm.rgb},.18);color:${cm.color};border:1px solid rgba(${cm.rgb},.35);border-radius:999px;padding:4px 12px;font-size:10px;font-weight:900;letter-spacing:.08em;`;
  document.getElementById("mKeyword").textContent=e.keyword;
  document.getElementById("mBody").textContent=e.body||"（本文未入力）";

  const branches=(e.branches||[]).filter(Boolean);
  if(branches.length){
    document.getElementById("mBranchWrap").style.display="";
    document.getElementById("mBranches").innerHTML=branches.map(b=>
      `<span class="m-branch" data-kw="${esc(b)}">${esc(b)}</span>`).join("");
    document.querySelectorAll(".m-branch").forEach(el=>{
      el.addEventListener("click",()=>{ jumpToKeyword(el.dataset.kw); closeDetail(); });
    });
  } else { document.getElementById("mBranchWrap").style.display="none"; }

  const sources=(e.sources||[]).filter(s=>s&&s.title);
  if(sources.length){
    document.getElementById("mSourceWrap").style.display="";
    document.getElementById("mSources").innerHTML=sources.map(s=>
      `<div class="m-source">☀ <a href="${esc(s.url||"#")}" target="_blank" rel="noopener">${esc(s.title)}</a></div>`).join("");
  } else { document.getElementById("mSourceWrap").style.display="none"; }

  if(e.session){
    document.getElementById("mSessionWrap").style.display="";
    document.getElementById("mSession").innerHTML=e.sessionUrl
      ?`🎥 <a href="${esc(e.sessionUrl)}" target="_blank">${esc(e.session)}</a>`
      :`🎥 ${esc(e.session)}`;
  } else { document.getElementById("mSessionWrap").style.display="none"; }

  document.getElementById("detailOv").classList.add("open");
}

function closeDetail(){
  document.getElementById("detailOv").classList.remove("open");
  selectedId=null;
}

// ── Jump by keyword ──
function jumpToKeyword(kw) {
  const target=entries.find(e=>e.keyword===kw);
  if(target){
    filter.q="";
    document.getElementById("searchInput").value="";
    if(currentView==="tree") renderTree(); else renderCards();
    openDetail(target.id);
  } else {
    filter.q=kw;
    document.getElementById("searchInput").value=kw;
    if(currentView==="cards") renderCards();
    toast(`「${kw}」のエントリはまだありません`);
  }
}

// ── Form ──
function openForm(entry=null){
  editId=entry?entry.id:null;
  document.getElementById("fTitle").textContent=entry?"エントリ編集":"新規エントリ";
  document.getElementById("fCat").value=entry?.category||"economics";
  document.getElementById("fStage").value=entry?.stage||"seed";
  document.getElementById("fKw").value=entry?.keyword||"";
  document.getElementById("fBody").value=entry?.body||"";
  document.getElementById("fBranches").value=(entry?.branches||[]).filter(Boolean).join(", ");
  document.getElementById("fSources").value=(entry?.sources||[]).filter(s=>s&&s.title).map(s=>`${s.title}|${s.url||""}`).join("\n");
  document.getElementById("fSession").value=entry?.session||"";
  document.getElementById("fSessionUrl").value=entry?.sessionUrl||"";
  document.getElementById("formOv").classList.add("open");
}
function closeForm(){document.getElementById("formOv").classList.remove("open");editId=null;}

function saveForm(){
  const kw=document.getElementById("fKw").value.trim();
  if(!kw){toast("キーワードは必須です");return;}
  const branches=document.getElementById("fBranches").value.split(/[,、，]+/).map(s=>s.trim()).filter(Boolean);
  const sources=document.getElementById("fSources").value.split("\n").map(line=>{
    const [t,...r]=line.split("|");
    return {title:t.trim(),url:(r.join("|")||"").trim()};
  }).filter(s=>s.title);
  const now=new Date().toISOString().slice(0,10);
  if(editId){
    entries=entries.map(e=>e.id===editId?{...e,
      category:document.getElementById("fCat").value,
      stage:document.getElementById("fStage").value,
      keyword:kw,body:document.getElementById("fBody").value.trim(),
      branches,sources,
      session:document.getElementById("fSession").value.trim(),
      sessionUrl:document.getElementById("fSessionUrl").value.trim(),
      updatedAt:now
    }:e);
    toast("更新しました");
  } else {
    entries.unshift({
      id:"rbt_"+Date.now()+"_"+Math.random().toString(36).slice(2,5),
      category:document.getElementById("fCat").value,
      stage:document.getElementById("fStage").value,
      keyword:kw,body:document.getElementById("fBody").value.trim(),
      branches,sources,
      session:document.getElementById("fSession").value.trim(),
      sessionUrl:document.getElementById("fSessionUrl").value.trim(),
      createdAt:now,updatedAt:now
    });
    toast("追加しました");
  }
  saveLocal(); closeForm();
  if(currentView==="tree") renderTree(); else renderCards();
}

function deleteEntry(id){
  if(!confirm("削除しますか？"))return;
  entries=entries.filter(e=>e.id!==id);
  saveLocal(); closeDetail();
  if(currentView==="tree") renderTree(); else renderCards();
  toast("削除しました");
}

// ── Gist ──
function openSync(){
  document.getElementById("sGistId").value=localStorage.getItem(LS_GIST_ID)||"";
  document.getElementById("sPat").value=localStorage.getItem(LS_GIST_PAT)||"";
  document.getElementById("syncSt").textContent="接続情報を入力してください";
  document.getElementById("syncOv").classList.add("open");
}
function closeSync(){document.getElementById("syncOv").classList.remove("open");}

async function syncLoad(){
  const gistId=document.getElementById("sGistId").value.trim();
  const pat=document.getElementById("sPat").value.trim();
  if(!gistId||!pat){document.getElementById("syncSt").textContent="Gist ID と PAT が必要です";return;}
  document.getElementById("syncSt").textContent="読込中…";
  try{
    const res=await fetch(`https://api.github.com/gists/${gistId}`,{headers:{Authorization:`token ${pat}`}});
    if(!res.ok) throw new Error("HTTP "+res.status);
    const data=await res.json();
    const raw=data.files?.[GIST_FILE]?.content;
    if(!raw) throw new Error("ファイルが見つかりません");
    const parsed=JSON.parse(raw);
    if(!Array.isArray(parsed.entries)) throw new Error("データ形式エラー");
    entries=parsed.entries;
    saveLocal();
    localStorage.setItem(LS_GIST_ID,gistId); localStorage.setItem(LS_GIST_PAT,pat);
    document.getElementById("syncSt").textContent=`✓ ${entries.length}件 読込完了`;
    if(currentView==="tree") renderTree(); else renderCards();
    toast("Gistから読込しました");
  }catch(e){document.getElementById("syncSt").textContent="エラー: "+e.message;}
}

async function syncSave(){
  let gistId=document.getElementById("sGistId").value.trim();
  const pat=document.getElementById("sPat").value.trim();
  if(!pat){document.getElementById("syncSt").textContent="PATが必要です";return;}
  document.getElementById("syncSt").textContent="保存中…";
  const payload=JSON.stringify({version:1,updatedAt:new Date().toISOString(),entries},null,2);
  try{
    if(gistId){
      const res=await fetch(`https://api.github.com/gists/${gistId}`,{method:"PATCH",
        headers:{Authorization:`token ${pat}`,"Content-Type":"application/json"},
        body:JSON.stringify({files:{[GIST_FILE]:{content:payload}}})});
      if(!res.ok) throw new Error("HTTP "+res.status);
    } else {
      const res=await fetch("https://api.github.com/gists",{method:"POST",
        headers:{Authorization:`token ${pat}`,"Content-Type":"application/json"},
        body:JSON.stringify({description:"RB-Tree Archive",public:false,files:{[GIST_FILE]:{content:payload}}})});
      if(!res.ok) throw new Error("HTTP "+res.status);
      const d=await res.json(); gistId=d.id;
      document.getElementById("sGistId").value=gistId;
    }
    localStorage.setItem(LS_GIST_ID,gistId); localStorage.setItem(LS_GIST_PAT,pat);
    document.getElementById("syncSt").textContent=`✓ 保存完了  ID: ${gistId}`;
    toast("Gistへ保存しました");
  }catch(e){document.getElementById("syncSt").textContent="エラー: "+e.message;}
}

// ── Storage ──
function saveLocal(){localStorage.setItem(LS_DATA,JSON.stringify(entries));}
function loadLocal(){try{return JSON.parse(localStorage.getItem(LS_DATA)||"[]");}catch{return[];}}

// ── Events ──
function bindUI(){
  document.getElementById("btnTree").addEventListener("click",()=>setView("tree"));
  document.getElementById("btnCards").addEventListener("click",()=>setView("cards"));
  document.getElementById("searchInput").addEventListener("input",e=>{
    filter.q=e.target.value;
    if(currentView==="tree") renderTree(); else renderCards();
  });
  document.querySelectorAll(".tab").forEach(tab=>{
    tab.addEventListener("click",()=>{
      filter.cat=tab.dataset.cat;
      renderTabs();
      if(currentView==="tree") renderTree(); else renderCards();
    });
  });
  document.getElementById("addBtnH").addEventListener("click",()=>openForm());
  document.getElementById("addBtnC").addEventListener("click",()=>openForm());
  document.getElementById("detailClose").addEventListener("click",closeDetail);
  document.getElementById("mCloseBtn").addEventListener("click",closeDetail);
  document.getElementById("detailOv").addEventListener("click",e=>{
    if(e.target===document.getElementById("detailOv")) closeDetail();
  });
  document.getElementById("mEditBtn").addEventListener("click",()=>{
    const e=entries.find(x=>x.id===selectedId);
    closeDetail(); if(e) openForm(e);
  });
  document.getElementById("mDeleteBtn").addEventListener("click",()=>deleteEntry(selectedId));
  document.getElementById("fCancelBtn").addEventListener("click",closeForm);
  document.getElementById("fSaveBtn").addEventListener("click",saveForm);
  document.getElementById("formOv").addEventListener("click",e=>{
    if(e.target===document.getElementById("formOv")) closeForm();
  });
  document.getElementById("syncOpenBtn").addEventListener("click",openSync);
  document.getElementById("sCancelBtn").addEventListener("click",closeSync);
  document.getElementById("sLoadBtn").addEventListener("click",syncLoad);
  document.getElementById("sSaveBtn").addEventListener("click",syncSave);
  document.addEventListener("keydown",e=>{
    if(e.key==="Escape"){closeDetail();closeForm();closeSync();}
  });
  window.addEventListener("resize",()=>{ if(currentView==="tree") renderTree(); });
}

// ── Util ──
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

let _toastT;
function toast(msg){
  const el=document.getElementById("toast");
  el.textContent=msg; el.classList.add("show");
  clearTimeout(_toastT); _toastT=setTimeout(()=>el.classList.remove("show"),2600);
}

init();
})();
</script>
