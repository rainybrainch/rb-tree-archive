<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RB-Tree Archive — RAINY BRAIN</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #080f0a;
  --bg2:       #0e1a10;
  --panel:     rgba(12,22,14,.94);
  --line:      rgba(100,180,120,.14);
  --text:      #d4e8d0;
  --muted:     rgba(180,210,180,.55);
  --faint:     rgba(180,210,180,.32);
  --econ:      #c9a84c;
  --poli:      #6bb6ff;
  --invest:    #57c87c;
  --seed-c:    #a8d08d;
  --branch-c:  #6db36d;
  --leaf-c:    #4a9c5f;
  --tree-c:    #2d7a4a;
  --forest-c:  #1a5c38;
  --radius:    10px;
  --font:      "Noto Sans JP", sans-serif;
  --serif:     "Noto Serif JP", serif;
  color-scheme: dark;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:var(--font);color:var(--text);background:var(--bg);}
button,input,textarea,select{font:inherit;color:inherit;}
a{color:inherit;text-decoration:none;}

/* ── LAYOUT ── */
.app{display:grid;grid-template-rows:56px 1fr;height:100vh;overflow:hidden;}
.header{
  display:flex;align-items:center;gap:14px;
  padding:0 20px;
  border-bottom:1px solid var(--line);
  background:linear-gradient(90deg,rgba(12,22,14,.98),rgba(8,15,10,.98));
  backdrop-filter:blur(14px);
  z-index:10;
}
.logo{display:flex;align-items:center;gap:10px;white-space:nowrap;}
.logo-mark{font-size:22px;line-height:1;}
.logo-text{font-family:var(--serif);font-size:15px;font-weight:700;letter-spacing:.06em;}
.logo-sub{font-size:10px;color:var(--muted);letter-spacing:.12em;font-weight:700;margin-top:2px;}
.search-bar{
  flex:1;max-width:480px;
  display:flex;align-items:center;gap:8px;
  padding:6px 12px;
  border:1px solid var(--line);border-radius:999px;
  background:rgba(0,0,0,.32);
  transition:border-color .2s;
}
.search-bar:focus-within{border-color:rgba(100,180,120,.4);}
.search-bar input{flex:1;background:transparent;border:0;outline:none;font-size:13px;}
.search-bar input::placeholder{color:var(--faint);}
.header-actions{margin-left:auto;display:flex;gap:8px;}

.body{display:grid;grid-template-columns:220px 1fr;overflow:hidden;}

/* ── SIDEBAR ── */
.sidebar{
  overflow-y:auto;padding:16px 12px;
  border-right:1px solid var(--line);
  background:rgba(8,14,10,.88);
  display:flex;flex-direction:column;gap:18px;
  scrollbar-width:thin;scrollbar-color:rgba(100,180,120,.15) transparent;
}
.sb-section{}
.sb-label{font-size:10px;font-weight:900;letter-spacing:.14em;color:var(--faint);text-transform:uppercase;margin-bottom:8px;}
.sb-cats{display:flex;flex-direction:column;gap:4px;}
.cat-btn{
  display:flex;align-items:center;gap:9px;
  padding:8px 10px;border-radius:8px;
  border:1px solid transparent;
  background:transparent;cursor:pointer;
  font-size:12px;font-weight:700;
  color:var(--muted);transition:all .15s;
  text-align:left;
}
.cat-btn:hover{background:rgba(100,180,120,.07);color:var(--text);}
.cat-btn.active{border-color:var(--cat-c,var(--invest));background:rgba(var(--cat-rgb,87,200,124),.12);color:var(--text);}
.cat-dot{width:8px;height:8px;border-radius:999px;background:var(--cat-c,var(--invest));flex-shrink:0;}
.cat-count{margin-left:auto;font-size:10px;color:var(--faint);}

.stage-btns{display:flex;flex-direction:column;gap:3px;}
.stage-btn{
  display:flex;align-items:center;gap:8px;
  padding:7px 10px;border-radius:8px;
  border:1px solid transparent;
  background:transparent;cursor:pointer;
  font-size:12px;font-weight:700;
  color:var(--muted);transition:all .15s;text-align:left;
}
.stage-btn:hover{background:rgba(100,180,120,.07);color:var(--text);}
.stage-btn.active{border-color:rgba(100,180,120,.3);background:rgba(100,180,120,.1);color:var(--text);}
.stage-ico{font-size:14px;line-height:1;}

.recent-list{display:flex;flex-direction:column;gap:4px;}
.recent-item{
  padding:7px 10px;border-radius:8px;cursor:pointer;
  font-size:11px;font-weight:700;color:var(--muted);
  border:1px solid transparent;transition:all .15s;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.recent-item:hover{background:rgba(100,180,120,.07);color:var(--text);}

/* ── MAIN ── */
.main{overflow-y:auto;padding:18px 20px;scrollbar-width:thin;scrollbar-color:rgba(100,180,120,.15) transparent;}
.main-top{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
.result-count{font-size:12px;color:var(--muted);font-weight:700;}
.add-btn{
  margin-left:auto;
  display:flex;align-items:center;gap:6px;
  padding:7px 14px;border-radius:8px;
  border:1px solid rgba(100,180,120,.4);
  background:rgba(100,180,120,.12);
  color:var(--text);cursor:pointer;
  font-size:12px;font-weight:900;letter-spacing:.04em;
  transition:background .15s;
}
.add-btn:hover{background:rgba(100,180,120,.22);}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;}
.card{
  border:1px solid var(--line);border-radius:var(--radius);
  background:var(--panel);
  padding:14px;cursor:pointer;
  transition:border-color .18s,transform .12s,box-shadow .18s;
  display:flex;flex-direction:column;gap:8px;
}
.card:hover{border-color:rgba(100,180,120,.35);transform:translateY(-1px);box-shadow:0 8px 24px rgba(0,0,0,.28);}
.card-top{display:flex;align-items:center;gap:8px;}
.card-stage{font-size:20px;line-height:1;flex-shrink:0;}
.card-cat{
  font-size:9px;font-weight:900;letter-spacing:.1em;
  padding:2px 7px;border-radius:999px;
  background:rgba(var(--ccat-rgb,87,200,124),.18);
  color:var(--ccat,var(--invest));
  border:1px solid rgba(var(--ccat-rgb,87,200,124),.3);
}
.card-keyword{font-family:var(--serif);font-size:17px;font-weight:700;line-height:1.2;overflow-wrap:anywhere;}
.card-body{font-size:12px;color:var(--muted);line-height:1.55;overflow-wrap:break-word;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.card-footer{display:flex;align-items:center;gap:8px;margin-top:auto;}
.card-branches{font-size:10px;color:var(--faint);font-weight:700;}
.card-date{font-size:10px;color:var(--faint);margin-left:auto;}
.empty{grid-column:1/-1;text-align:center;padding:60px 0;color:var(--faint);font-size:14px;font-weight:700;}

/* ── MODAL ── */
.overlay{
  position:fixed;inset:0;z-index:50;
  background:rgba(0,0,0,.72);backdrop-filter:blur(8px);
  display:none;align-items:flex-start;justify-content:flex-end;
  padding:0;
}
.overlay.open{display:flex;}
.modal{
  width:min(560px,100vw);height:100vh;overflow-y:auto;
  background:linear-gradient(180deg,var(--bg2),var(--bg));
  border-left:1px solid var(--line);
  padding:24px;display:flex;flex-direction:column;gap:18px;
  scrollbar-width:thin;scrollbar-color:rgba(100,180,120,.15) transparent;
  animation:slideIn .22s ease;
}
@keyframes slideIn{from{transform:translateX(40px);opacity:0;}to{transform:none;opacity:1;}}
.modal-close{
  align-self:flex-end;
  width:32px;height:32px;border-radius:8px;
  border:1px solid var(--line);background:rgba(255,255,255,.06);
  color:var(--muted);cursor:pointer;font-size:16px;
  display:grid;place-items:center;transition:background .15s;
}
.modal-close:hover{background:rgba(255,255,255,.12);}
.modal-stage-path{display:flex;align-items:center;gap:4px;flex-wrap:wrap;}
.path-item{
  display:flex;align-items:center;gap:4px;
  font-size:11px;font-weight:900;letter-spacing:.06em;
  padding:4px 9px;border-radius:999px;
  border:1px solid var(--line);color:var(--faint);
  transition:all .15s;
}
.path-item.active{color:var(--text);border-color:rgba(100,180,120,.5);background:rgba(100,180,120,.14);}
.path-arrow{color:var(--faint);font-size:11px;}
.modal-keyword{font-family:var(--serif);font-size:26px;font-weight:700;line-height:1.2;overflow-wrap:anywhere;}
.modal-cat-badge{
  display:inline-flex;align-items:center;gap:6px;
  font-size:11px;font-weight:900;letter-spacing:.08em;
  padding:4px 10px;border-radius:999px;
}
.section-label{font-size:10px;font-weight:900;letter-spacing:.14em;color:var(--faint);text-transform:uppercase;}
.modal-body{font-size:14px;line-height:1.75;color:var(--text);overflow-wrap:break-word;white-space:pre-wrap;}
.branches-list{display:flex;flex-wrap:wrap;gap:6px;}
.branch-tag{
  padding:5px 11px;border-radius:999px;
  border:1px solid rgba(100,180,120,.28);
  background:rgba(100,180,120,.08);
  font-size:12px;font-weight:700;cursor:pointer;
  transition:all .15s;
}
.branch-tag:hover{border-color:rgba(100,180,120,.6);background:rgba(100,180,120,.18);color:var(--text);}
.sources-list{display:flex;flex-direction:column;gap:6px;}
.source-item{
  display:flex;align-items:center;gap:8px;
  font-size:12px;color:var(--muted);
  padding:7px 10px;border-radius:8px;
  border:1px solid var(--line);background:rgba(0,0,0,.18);
}
.source-item a{color:var(--invest);text-decoration:underline;text-underline-offset:3px;}
.session-link{
  display:flex;align-items:center;gap:9px;
  padding:10px 14px;border-radius:9px;
  border:1px solid rgba(100,180,120,.22);background:rgba(100,180,120,.07);
  font-size:12px;font-weight:700;
}
.session-link a{color:var(--invest);}
.modal-actions{display:flex;gap:8px;padding-top:4px;border-top:1px solid var(--line);margin-top:auto;}

/* ── FORM ── */
.form-overlay{
  position:fixed;inset:0;z-index:60;
  background:rgba(0,0,0,.8);backdrop-filter:blur(10px);
  display:none;align-items:center;justify-content:center;padding:20px;
}
.form-overlay.open{display:flex;}
.form-panel{
  width:min(600px,100%);max-height:90vh;overflow-y:auto;
  background:var(--bg2);border:1px solid var(--line);
  border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:14px;
  scrollbar-width:thin;scrollbar-color:rgba(100,180,120,.15) transparent;
  animation:fadeUp .22s ease;
}
@keyframes fadeUp{from{transform:translateY(16px);opacity:0;}to{transform:none;opacity:1;}}
.form-title{font-family:var(--serif);font-size:18px;font-weight:700;}
.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:11px;font-weight:900;letter-spacing:.1em;color:var(--faint);text-transform:uppercase;}
.field input,.field textarea,.field select{
  padding:9px 11px;border:1px solid var(--line);border-radius:8px;
  background:rgba(0,0,0,.3);outline:none;font-size:13px;
  transition:border-color .15s;
}
.field input:focus,.field textarea:focus,.field select:focus{border-color:rgba(100,180,120,.5);}
.field textarea{min-height:100px;resize:vertical;line-height:1.6;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.form-actions{display:flex;gap:8px;justify-content:flex-end;padding-top:4px;border-top:1px solid var(--line);}

/* ── BUTTONS ── */
.btn{
  padding:8px 16px;border-radius:8px;border:1px solid var(--line);
  background:rgba(255,255,255,.07);cursor:pointer;font-size:12px;font-weight:900;
  transition:background .15s;letter-spacing:.04em;
}
.btn:hover{background:rgba(255,255,255,.13);}
.btn.primary{border-color:rgba(100,180,120,.5);background:rgba(100,180,120,.16);}
.btn.primary:hover{background:rgba(100,180,120,.26);}
.btn.danger{border-color:rgba(255,90,90,.4);background:rgba(255,90,90,.1);color:#ff8080;}
.btn.danger:hover{background:rgba(255,90,90,.2);}
.btn.sm{padding:5px 11px;font-size:11px;min-height:32px;}

/* ── SYNC PANEL ── */
.sync-overlay{
  position:fixed;inset:0;z-index:70;
  background:rgba(0,0,0,.8);backdrop-filter:blur(10px);
  display:none;align-items:center;justify-content:center;padding:20px;
}
.sync-overlay.open{display:flex;}
.sync-panel{
  width:min(460px,100%);
  background:var(--bg2);border:1px solid var(--line);
  border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:14px;
}
.sync-status{font-size:12px;color:var(--muted);min-height:20px;}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  padding:10px 20px;border-radius:999px;
  background:rgba(12,22,14,.95);border:1px solid rgba(100,180,120,.4);
  font-size:12px;font-weight:900;letter-spacing:.06em;
  pointer-events:none;z-index:100;
  opacity:0;transition:opacity .25s;white-space:nowrap;
}
.toast.show{opacity:1;}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-thumb{background:rgba(100,180,120,.2);border-radius:999px;}

/* ── RESPONSIVE ── */
@media(max-width:860px){
  .body{grid-template-columns:1fr;}
  .sidebar{display:none;}
  .cards{grid-template-columns:repeat(auto-fill,minmax(180px,1fr));}
}
@media(max-width:500px){
  .cards{grid-template-columns:1fr;}
  .modal{width:100vw;}
  .grid2{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="header">
    <div class="logo">
      <span class="logo-mark">🌲</span>
      <div>
        <div class="logo-text">RB-Tree Archive</div>
        <div class="logo-sub">RAINY BRAIN</div>
      </div>
    </div>
    <div class="search-bar">
      <span style="color:var(--faint);font-size:13px">🔍</span>
      <input id="searchInput" type="search" placeholder="キーワード・本文を検索…" autocomplete="off">
    </div>
    <div class="header-actions">
      <button class="btn sm" id="syncOpenBtn">⇅ Gist 同期</button>
    </div>
  </header>

  <div class="body">
    <aside class="sidebar" id="sidebar">
      <div class="sb-section">
        <div class="sb-label">カテゴリ</div>
        <div class="sb-cats" id="catBtns">
          <button class="cat-btn active" data-cat="" style="--cat-c:var(--invest);--cat-rgb:87,200,124">
            <span class="cat-dot" style="background:var(--text);opacity:.4"></span>すべて
            <span class="cat-count" id="countAll">0</span>
          </button>
          <button class="cat-btn" data-cat="economics" style="--cat-c:var(--econ);--cat-rgb:201,168,76">
            <span class="cat-dot" style="background:var(--econ)"></span>Economics
            <span class="cat-count" id="countEcon">0</span>
          </button>
          <button class="cat-btn" data-cat="politics" style="--cat-c:var(--poli);--cat-rgb:107,182,255">
            <span class="cat-dot" style="background:var(--poli)"></span>Politics
            <span class="cat-count" id="countPoli">0</span>
          </button>
          <button class="cat-btn" data-cat="investment" style="--cat-c:var(--invest);--cat-rgb:87,200,124">
            <span class="cat-dot" style="background:var(--invest)"></span>Investment
            <span class="cat-count" id="countInvest">0</span>
          </button>
        </div>
      </div>

      <div class="sb-section">
        <div class="sb-label">ステージ</div>
        <div class="stage-btns" id="stageBtns">
          <button class="stage-btn active" data-stage="">
            <span class="stage-ico">🌲</span>すべて
          </button>
          <button class="stage-btn" data-stage="seed">
            <span class="stage-ico">🌱</span>Seed — 種
          </button>
          <button class="stage-btn" data-stage="branch">
            <span class="stage-ico">🌿</span>Branch — 枝
          </button>
          <button class="stage-btn" data-stage="leaf">
            <span class="stage-ico">🍃</span>Leaf — 葉
          </button>
          <button class="stage-btn" data-stage="tree">
            <span class="stage-ico">🌳</span>Tree — 樹
          </button>
          <button class="stage-btn" data-stage="forest">
            <span class="stage-ico">🌲</span>Forest — 森
          </button>
        </div>
      </div>

      <div class="sb-section">
        <div class="sb-label">最近追加</div>
        <div class="recent-list" id="recentList"></div>
      </div>
    </aside>

    <main class="main" id="main">
      <div class="main-top">
        <span class="result-count" id="resultCount"></span>
        <button class="add-btn" id="addBtn">＋ 新規エントリ</button>
      </div>
      <div class="cards" id="cards"></div>
    </main>
  </div>
</div>

<!-- 詳細モーダル -->
<div class="overlay" id="detailOverlay">
  <div class="modal" id="detailModal">
    <button class="modal-close" id="detailClose">✕</button>
    <div class="modal-stage-path" id="stagePath"></div>
    <div>
      <div class="modal-cat-badge" id="modalCatBadge"></div>
    </div>
    <div class="modal-keyword" id="modalKeyword"></div>
    <div>
      <div class="section-label" style="margin-bottom:8px">🍃 Leaf — 学びの記録</div>
      <div class="modal-body" id="modalBody"></div>
    </div>
    <div id="modalBranchesWrap">
      <div class="section-label" style="margin-bottom:8px">🌿 Branch — 関連キーワード</div>
      <div class="branches-list" id="modalBranches"></div>
    </div>
    <div id="modalSourcesWrap">
      <div class="section-label" style="margin-bottom:8px">☀ Sun — 知識源</div>
      <div class="sources-list" id="modalSources"></div>
    </div>
    <div id="modalSessionWrap" style="display:none">
      <div class="section-label" style="margin-bottom:8px">🎥 Session</div>
      <div class="session-link" id="modalSession"></div>
    </div>
    <div class="modal-actions">
      <button class="btn primary sm" id="modalEditBtn">編集</button>
      <button class="btn danger sm" id="modalDeleteBtn">削除</button>
      <button class="btn sm" id="modalCloseBtn" style="margin-left:auto">閉じる</button>
    </div>
  </div>
</div>

<!-- エントリフォーム -->
<div class="form-overlay" id="formOverlay">
  <div class="form-panel">
    <div class="form-title" id="formTitle">新規エントリ</div>
    <div class="grid2">
      <div class="field">
        <label>カテゴリ</label>
        <select id="fCategory">
          <option value="economics">🟡 Economics</option>
          <option value="politics">🔵 Politics</option>
          <option value="investment">🟢 Investment</option>
        </select>
      </div>
      <div class="field">
        <label>ステージ</label>
        <select id="fStage">
          <option value="seed">🌱 Seed</option>
          <option value="branch">🌿 Branch</option>
          <option value="leaf">🍃 Leaf</option>
          <option value="tree">🌳 Tree</option>
          <option value="forest">🌲 Forest</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>キーワード</label>
      <input id="fKeyword" placeholder="例: 金利" maxlength="40">
    </div>
    <div class="field">
      <label>学びの記録（自分の言葉で）</label>
      <textarea id="fBody" placeholder="このキーワードについて、自分の言葉で説明してください…" rows="5"></textarea>
    </div>
    <div class="field">
      <label>Branch — 関連キーワード（カンマ区切り）</label>
      <input id="fBranches" placeholder="例: 利上げ, 国債, 為替">
    </div>
    <div class="field">
      <label>Sun — 知識源 URL（1行1件: タイトル|URL）</label>
      <textarea id="fSources" placeholder="日本銀行|https://www.boj.or.jp" rows="3"></textarea>
    </div>
    <div class="grid2">
      <div class="field">
        <label>Session</label>
        <input id="fSession" placeholder="例: RB-Tree Economics #001">
      </div>
      <div class="field">
        <label>Session URL</label>
        <input id="fSessionUrl" placeholder="https://youtube.com/...">
      </div>
    </div>
    <div class="form-actions">
      <button class="btn sm" id="formCancelBtn">キャンセル</button>
      <button class="btn primary sm" id="formSaveBtn">保存</button>
    </div>
  </div>
</div>

<!-- Gist同期パネル -->
<div class="sync-overlay" id="syncOverlay">
  <div class="sync-panel">
    <div class="form-title">⇅ Gist 同期</div>
    <div class="field">
      <label>Gist ID</label>
      <input id="syncGistId" placeholder="（新規作成時は空欄）">
    </div>
    <div class="field">
      <label>GitHub PAT（gist スコープ）</label>
      <input id="syncPat" type="password" placeholder="ghp_...">
    </div>
    <div class="sync-status" id="syncStatus">未接続</div>
    <div class="form-actions">
      <button class="btn sm" id="syncCancelBtn">閉じる</button>
      <button class="btn sm" id="syncLoadBtn">Gistから読込</button>
      <button class="btn primary sm" id="syncSaveBtn">Gistへ保存</button>
    </div>
  </div>
</div>

  {id:"rbt_poli_07",category:"politics",stage:"seed",keyword:"社会保障",body:"年金・医療・介護・失業給付など、生活を守る公的制度。少子高齢化で財政負担が増大している。",branches:["税金","国家予算","年金"],sources:[],session:"",sessionUrl:"",createdAt:"2026-06-01",updatedAt:"2026-06-01"},

// ── 初期化 ──
function init() {
  const saved = loadLocal();
  entries = saved.length ? saved : SEED_ENTRIES.map(e=>({...e}));
  bindEvents();
  render();
}

// ── レンダリング ──
function render() {
  renderCounts();
  renderCards();
  renderRecent();
}

function filteredEntries() {
  const q = filter.q.trim().toLowerCase();
  return entries.filter(e => {
    if (filter.cat   && e.category !== filter.cat)   return false;
    if (filter.stage && e.stage    !== filter.stage) return false;
    if (q && !( e.keyword.toLowerCase().includes(q) ||
                e.body.toLowerCase().includes(q) ||
                (e.branches||[]).some(b=>b.toLowerCase().includes(q)) )) return false;
    return true;
  });
}

function renderCounts() {
  const all  = entries.length;
  const econ = entries.filter(e=>e.category==="economics").length;
  const poli = entries.filter(e=>e.category==="politics").length;
  const inv  = entries.filter(e=>e.category==="investment").length;
  document.getElementById("countAll").textContent    = all;
  document.getElementById("countEcon").textContent   = econ;
  document.getElementById("countPoli").textContent   = poli;
  document.getElementById("countInvest").textContent = inv;
}

function renderCards() {
  const list = filteredEntries();
  const container = document.getElementById("cards");
  document.getElementById("resultCount").textContent = `${list.length} 件`;
  if (!list.length) {
    container.innerHTML = `<div class="empty">エントリが見つかりません</div>`;
    return;
  }
  container.innerHTML = list.map(e => {
    const cm = CAT_META[e.category] || CAT_META.economics;
    const sm = STAGE_META[e.stage]  || STAGE_META.seed;
    const brCount = (e.branches||[]).filter(Boolean).length;
    const date = (e.updatedAt||e.createdAt||"").slice(0,10);
    return `<div class="card" data-id="${e.id}">
      <div class="card-top">
        <span class="card-stage">${sm.icon}</span>
        <span class="card-cat" style="--ccat:${cm.color};--ccat-rgb:${cm.rgb}">${cm.label}</span>
      </div>
      <div class="card-keyword">${esc(e.keyword)}</div>
      <div class="card-body">${esc(e.body||"（本文未入力）")}</div>
      <div class="card-footer">
        <span class="card-branches">${brCount > 0 ? `🌿 ${brCount}枝` : ""}</span>
        <span class="card-date">${date}</span>
      </div>
    </div>`;
  }).join("");

  container.querySelectorAll(".card").forEach(el => {
    el.addEventListener("click", () => openDetail(el.dataset.id));
  });
}

function renderRecent() {
  const recent = [...entries].sort((a,b)=>
    (b.updatedAt||b.createdAt||"").localeCompare(a.updatedAt||a.createdAt||"")
  ).slice(0,6);
  document.getElementById("recentList").innerHTML = recent.map(e =>
    `<div class="recent-item" data-id="${e.id}">${STAGE_META[e.stage]?.icon||"🌱"} ${esc(e.keyword)}</div>`
  ).join("");
  document.querySelectorAll(".recent-item").forEach(el => {
    el.addEventListener("click", () => openDetail(el.dataset.id));
  });
}

// ── 詳細モーダル ──
function openDetail(id) {
  const e = entries.find(x=>x.id===id);
  if (!e) return;
  selectedId = id;
  const cm = CAT_META[e.category] || CAT_META.economics;
  const sm = STAGE_META[e.stage]  || STAGE_META.seed;

  // stage path
  document.getElementById("stagePath").innerHTML = STAGES.map((s,i) => {
    const m = STAGE_META[s];
    const isActive = s === e.stage;
    return (i>0 ? `<span class="path-arrow">→</span>` : "") +
      `<span class="path-item ${isActive?"active":""}">${m.icon} ${m.label}</span>`;
  }).join("");

  // badge
  document.getElementById("modalCatBadge").innerHTML =
    `<span style="font-size:14px">${cm.icon}</span>`;
  document.getElementById("modalCatBadge").style.cssText =
    `background:rgba(${cm.rgb},.18);color:${cm.color};border:1px solid rgba(${cm.rgb},.35);border-radius:999px;padding:4px 10px;font-size:11px;font-weight:900;letter-spacing:.08em;display:inline-flex;align-items:center;gap:6px;`;
  document.getElementById("modalCatBadge").innerHTML +=
    ` <span>${cm.label}</span> <span style="opacity:.6;font-size:10px">${sm.icon} ${sm.label}</span>`;

  document.getElementById("modalKeyword").textContent = e.keyword;
  document.getElementById("modalBody").textContent    = e.body || "（本文未入力）";

  // branches
  const branches = (e.branches||[]).filter(Boolean);
  if (branches.length) {
    document.getElementById("modalBranchesWrap").style.display = "";
    document.getElementById("modalBranches").innerHTML = branches.map(b =>
      `<span class="branch-tag" data-kw="${esc(b)}">${esc(b)}</span>`
    ).join("");
    document.querySelectorAll(".branch-tag").forEach(el => {
      el.addEventListener("click", () => {
        jumpToKeyword(el.dataset.kw);
        closeDetail();
      });
    });
  } else {
    document.getElementById("modalBranchesWrap").style.display = "none";
  }

  // sources
  const sources = (e.sources||[]).filter(s=>s&&s.title);
  if (sources.length) {
    document.getElementById("modalSourcesWrap").style.display = "";
    document.getElementById("modalSources").innerHTML = sources.map(s =>
      `<div class="source-item">☀<a href="${esc(s.url||"#")}" target="_blank" rel="noopener">${esc(s.title)}</a></div>`
    ).join("");
  } else {
    document.getElementById("modalSourcesWrap").style.display = "none";
  }

  // session
  if (e.session) {
    document.getElementById("modalSessionWrap").style.display = "";
    document.getElementById("modalSession").innerHTML = e.sessionUrl
      ? `🎥 <a href="${esc(e.sessionUrl)}" target="_blank">${esc(e.session)}</a>`
      : `🎥 ${esc(e.session)}`;
  } else {
    document.getElementById("modalSessionWrap").style.display = "none";
  }

  document.getElementById("detailOverlay").classList.add("open");
}

function closeDetail() {
  document.getElementById("detailOverlay").classList.remove("open");
  selectedId = null;
}

// ── フォーム ──
function openForm(entry = null) {
  editId = entry ? entry.id : null;
  document.getElementById("formTitle").textContent = entry ? "エントリ編集" : "新規エントリ";
  document.getElementById("fCategory").value   = entry?.category   || "economics";
  document.getElementById("fStage").value       = entry?.stage      || "seed";
  document.getElementById("fKeyword").value     = entry?.keyword    || "";
  document.getElementById("fBody").value        = entry?.body       || "";
  document.getElementById("fBranches").value    = (entry?.branches||[]).filter(Boolean).join(", ");
  document.getElementById("fSources").value     = (entry?.sources||[]).filter(s=>s&&s.title)
    .map(s=>`${s.title}|${s.url||""}`).join("\n");
  document.getElementById("fSession").value     = entry?.session    || "";
  document.getElementById("fSessionUrl").value  = entry?.sessionUrl || "";
  document.getElementById("formOverlay").classList.add("open");
}

function closeForm() {
  document.getElementById("formOverlay").classList.remove("open");
  editId = null;
}

function saveForm() {
  const kw = document.getElementById("fKeyword").value.trim();
  if (!kw) { toast("キーワードは必須です"); return; }
  const branches = document.getElementById("fBranches").value
    .split(/[,、，]+/).map(s=>s.trim()).filter(Boolean);
  const sources = document.getElementById("fSources").value
    .split("\n").map(line => {
      const [title,...rest] = line.split("|");
      return { title:title.trim(), url:(rest.join("|")||"").trim() };
    }).filter(s=>s.title);
  const now = new Date().toISOString().slice(0,10);

  if (editId) {
    entries = entries.map(e => e.id===editId ? {
      ...e,
      category:   document.getElementById("fCategory").value,
      stage:      document.getElementById("fStage").value,
      keyword:    kw,
      body:       document.getElementById("fBody").value.trim(),
      branches, sources,
      session:    document.getElementById("fSession").value.trim(),
      sessionUrl: document.getElementById("fSessionUrl").value.trim(),
      updatedAt:  now
    } : e);
    toast("更新しました");
  } else {
    const newEntry = {
      id: "rbt_" + Date.now() + "_" + Math.random().toString(36).slice(2,6),
      category:   document.getElementById("fCategory").value,
      stage:      document.getElementById("fStage").value,
      keyword:    kw,
      body:       document.getElementById("fBody").value.trim(),
      branches, sources,
      session:    document.getElementById("fSession").value.trim(),
      sessionUrl: document.getElementById("fSessionUrl").value.trim(),
      createdAt:  now,
      updatedAt:  now
    };
    entries.unshift(newEntry);
    toast("追加しました");
  }
  saveLocal();
  closeForm();
  render();
}

function deleteEntry(id) {
  if (!confirm("このエントリを削除しますか？")) return;
  entries = entries.filter(e=>e.id!==id);
  saveLocal();
  closeDetail();
  render();
  toast("削除しました");
}

// ── 関連キーワードジャンプ ──
function jumpToKeyword(kw) {
  const target = entries.find(e => e.keyword === kw);
  if (target) {
    filter.q = "";
    filter.cat = "";
    filter.stage = "";
    document.getElementById("searchInput").value = "";
    updateFilterUI();
    render();
    openDetail(target.id);
  } else {
    filter.q = kw;
    document.getElementById("searchInput").value = kw;
    render();
    toast(`「${kw}」のエントリはまだありません`);
  }
}

// ── Gist 同期 ──
function openSync() {
  document.getElementById("syncGistId").value = localStorage.getItem(LS_GIST_ID)||"";
  document.getElementById("syncPat").value    = localStorage.getItem(LS_GIST_PAT)||"";
  document.getElementById("syncStatus").textContent = "接続情報を入力してください";
  document.getElementById("syncOverlay").classList.add("open");
}
function closeSync() {
  document.getElementById("syncOverlay").classList.remove("open");
}

async function syncLoad() {
  const gistId = document.getElementById("syncGistId").value.trim();
  const pat    = document.getElementById("syncPat").value.trim();
  if (!gistId || !pat) { document.getElementById("syncStatus").textContent="Gist ID と PAT が必要です"; return; }
  document.getElementById("syncStatus").textContent = "読込中…";
  try {
    const res = await fetch(`https://api.github.com/gists/${gistId}`, {
      headers:{ Authorization:`token ${pat}`, Accept:"application/vnd.github.v3+json" }
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    const raw  = data.files?.[GIST_FILE]?.content;
    if (!raw) throw new Error("ファイルが見つかりません");
    const parsed = JSON.parse(raw);
    if (Array.isArray(parsed.entries)) {
      entries = parsed.entries;
      saveLocal();
      render();
      localStorage.setItem(LS_GIST_ID, gistId);
      localStorage.setItem(LS_GIST_PAT, pat);
      document.getElementById("syncStatus").textContent = `✓ ${entries.length}件 読込完了`;
      toast("Gistから読込しました");
    } else { throw new Error("データ形式が違います"); }
  } catch(e) {
    document.getElementById("syncStatus").textContent = "エラー: " + e.message;
  }
}

async function syncSave() {
  let gistId = document.getElementById("syncGistId").value.trim();
  const pat  = document.getElementById("syncPat").value.trim();
  if (!pat) { document.getElementById("syncStatus").textContent="PATが必要です"; return; }
  document.getElementById("syncStatus").textContent = "保存中…";
  const payload = JSON.stringify({ version:1, updatedAt:new Date().toISOString(), entries }, null, 2);
  try {
    if (gistId) {
      // update
      const res = await fetch(`https://api.github.com/gists/${gistId}`, {
        method:"PATCH",
        headers:{ Authorization:`token ${pat}`, "Content-Type":"application/json" },
        body: JSON.stringify({ files:{ [GIST_FILE]:{ content:payload } } })
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
    } else {
      // create
      const res = await fetch("https://api.github.com/gists", {
        method:"POST",
        headers:{ Authorization:`token ${pat}`, "Content-Type":"application/json" },
        body: JSON.stringify({
          description:"RB-Tree Archive Data",
          public: false,
          files:{ [GIST_FILE]:{ content:payload } }
        })
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      gistId = data.id;
      document.getElementById("syncGistId").value = gistId;
    }
    localStorage.setItem(LS_GIST_ID, gistId);
    localStorage.setItem(LS_GIST_PAT, pat);
    document.getElementById("syncStatus").textContent = `✓ 保存完了 Gist ID: ${gistId}`;
    toast("Gistへ保存しました");
  } catch(e) {
    document.getElementById("syncStatus").textContent = "エラー: " + e.message;
  }
}

// ── ローカル保存 ──
function saveLocal() {
  localStorage.setItem(LS_DATA, JSON.stringify(entries));
}
function loadLocal() {
  try { return JSON.parse(localStorage.getItem(LS_DATA)||"[]"); } catch { return []; }
}

// ── フィルター ──
function updateFilterUI() {
  document.querySelectorAll("[data-cat]").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.cat === filter.cat);
  });
  document.querySelectorAll("[data-stage]").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.stage === filter.stage);
  });
}

// ── イベントバインド ──
function bindEvents() {
  document.getElementById("searchInput").addEventListener("input", e => {
    filter.q = e.target.value;
    render();
  });

  document.querySelectorAll("[data-cat]").forEach(btn => {
    btn.addEventListener("click", () => {
      filter.cat = btn.dataset.cat;
      updateFilterUI();
      renderCards();
    });
  });

  document.querySelectorAll("[data-stage]").forEach(btn => {
    btn.addEventListener("click", () => {
      filter.stage = btn.dataset.stage;
      updateFilterUI();
      renderCards();
    });
  });

  document.getElementById("addBtn").addEventListener("click", () => openForm());

  // 詳細モーダル
  document.getElementById("detailClose").addEventListener("click", closeDetail);
  document.getElementById("modalCloseBtn").addEventListener("click", closeDetail);
  document.getElementById("detailOverlay").addEventListener("click", e => {
    if (e.target === document.getElementById("detailOverlay")) closeDetail();
  });
  document.getElementById("modalEditBtn").addEventListener("click", () => {
    const e = entries.find(x=>x.id===selectedId);
    closeDetail();
    if (e) openForm(e);
  });
  document.getElementById("modalDeleteBtn").addEventListener("click", () => deleteEntry(selectedId));

  // フォーム
  document.getElementById("formCancelBtn").addEventListener("click", closeForm);
  document.getElementById("formSaveBtn").addEventListener("click", saveForm);
  document.getElementById("formOverlay").addEventListener("click", e => {
    if (e.target === document.getElementById("formOverlay")) closeForm();
  });

  // Gist同期
  document.getElementById("syncOpenBtn").addEventListener("click", openSync);
  document.getElementById("syncCancelBtn").addEventListener("click", closeSync);
  document.getElementById("syncLoadBtn").addEventListener("click", syncLoad);
  document.getElementById("syncSaveBtn").addEventListener("click", syncSave);

  // キーボード
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") {
      closeDetail(); closeForm(); closeSync();
    }
  });
}

// ── ユーティリティ ──
function esc(s) {
  return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

let toastTimer;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2800);
}

init();
})();
</script>

</html>
